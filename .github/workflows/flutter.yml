name: Flutter CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          flutter create --platforms=web --org kz.mihrab --project-name mihrab .
          flutter build web --release
