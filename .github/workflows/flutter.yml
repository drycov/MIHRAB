name: Flutter CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: SDK diagnostics
        run: |
          mkdir -p ci-logs
          flutter --version | tee ci-logs/sdk.txt
          flutter doctor -v | tee ci-logs/doctor.txt
      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee ci-logs/pub-get.txt
        shell: bash
      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee ci-logs/analyze.txt
        shell: bash
      - name: Tests
        if: success() || failure()
        run: flutter test --reporter expanded 2>&1 | tee ci-logs/test.txt
        shell: bash
      - name: Build web
        if: success() || failure()
        run: flutter build web --release --no-pub 2>&1 | tee ci-logs/web.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-verify-logs
          path: ci-logs/
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: SDK diagnostics
        run: |
          mkdir -p ci-logs
          flutter --version | tee ci-logs/sdk.txt
          java -version 2>&1 | tee ci-logs/java.txt
      - name: Resolve dependencies
        run: flutter pub get 2>&1 | tee ci-logs/pub-get.txt
        shell: bash
      - name: Build Android
        run: flutter build apk --debug --no-pub 2>&1 | tee ci-logs/android.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-android-logs
          path: ci-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mihrab-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
